<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bentuk Molekul — Hibridisasi sp³d</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ff8fc7; --bg2:#8a4fe8; --panel:#fff6fa;
  --ink:#2b0a3d; --ink-dim:#7a4a8b;
  --orbit:#0ca678; --electron:#e64980; --danger:#e0392b; --good:#0ca678;
  --border:rgba(43,10,61,.14);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg1:#3d0a4a; --bg2:#5c1240; --panel:#4a1650; --ink:#ffe3ee; --ink-dim:#dcb0e0; --border:rgba(255,227,238,.16); }
}
:root[data-theme="dark"]{ --bg1:#3d0a4a; --bg2:#5c1240; --panel:#4a1650; --ink:#ffe3ee; --ink-dim:#dcb0e0; --border:rgba(255,227,238,.16); }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(90% 90% at 12% 8%, rgba(255,163,199,.85), transparent 60%),
    radial-gradient(80% 80% at 88% 12%, rgba(255,196,120,.5), transparent 55%),
    radial-gradient(95% 95% at 85% 92%, rgba(122,79,214,.9), transparent 60%),
    radial-gradient(85% 85% at 10% 92%, rgba(66,178,178,.4), transparent 55%),
    linear-gradient(145deg, var(--bg1), var(--bg2));
  color:var(--ink); font-family:'Inter',sans-serif; overflow:hidden; position:relative;
}
.bg-decor{position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none}
.bg-decor .item{position:absolute}
.app{position:relative; z-index:1; height:100%; display:flex; flex-direction:column;}
header{
  padding:14px 20px;
  display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border);
  flex-shrink:0; background:rgba(255,255,255,.12); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
header img.badge{width:34px;height:34px;flex-shrink:0;object-fit:contain}
header h2{font-family:'Fraunces',serif; font-size:15px; font-weight:600; margin:0; letter-spacing:.2px}
